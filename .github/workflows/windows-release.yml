name: Verify Windows release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run pack:win -- --publish never
      - run: npm run check:installer
      - run: npm run check:packaged
      - name: Exercise v0.6.0 in-app update
        run: node scripts/check-windows-release-upgrade.mjs
      - name: Smoke test the upgraded installation
        run: npm run check:packaged -- "$env:LOCALAPPDATA/Programs/tsuzune/TSUZUNE.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tsuzune-windows-release
          if-no-files-found: error
          path: |
            dist/TSUZUNE-Setup-*.exe
            dist/TSUZUNE-Setup-*.exe.blockmap
            dist/latest.yml
            dist/windows-upgrade-verification.json
